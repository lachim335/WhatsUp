name: Aktualizace akcí a nasazení

on:
  schedule:
    # every day at 04:20 UTC (05:20 / 06:20 Prague) and again on Thursday + Friday afternoon
    - cron: "20 4 * * *"
    - cron: "20 14 * * 4,5"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["site/data/**", "README.md"]

permissions:
  contents: write     # commit refreshed data (also keeps the scheduled workflow alive)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # latest main, not the triggering commit (matters for re-runs)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scrape events
        run: python -m scraper.main --out site/data/events.json --weeks 5

      - name: Commit refreshed data
        # Saving data to the repo is nice-to-have; never let it block deploying the site.
        continue-on-error: true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/events.json site/data/events.js
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Aktualizace akcí $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            # main may have moved (another run, a push): replay on top, freshly scraped data wins
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
