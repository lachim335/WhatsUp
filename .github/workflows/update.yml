name: Aktualizace akcí a nasazení

on:
  schedule:
    # every day at 04:20 UTC (05:20 / 06:20 Prague) and again on Thursday + Friday afternoon
    - cron: "20 4 * * *"
    - cron: "20 14 * * 4,5"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["site/data/**", "README.md"]

permissions:
  contents: write     # commit refreshed data (also keeps the scheduled workflow alive)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scrape events
        run: python -m scraper.main --out site/data/events.json --weeks 5

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/events.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Aktualizace akcí $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
