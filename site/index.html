<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Co se děje · Ostrava & F-M</title>
  <meta name="description" content="Přehled kulturních akcí na nadcházející víkendy v Ostravě a Frýdku-Místku.">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0d0f13">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f2b35b'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%230d0f13'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <p class="eyebrow">Ostrava · Frýdek-Místek · okolí</p>
      <h1>Co se děje <span>o víkendu</span></h1>
      <p class="sub" id="updated">Načítám program…</p>
    </div>
  </header>

  <div class="toolbar" id="toolbar">
    <div class="wrap">
      <div class="row">
        <div class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="search" placeholder="Hledat akci, místo, interpreta…" autocomplete="off">
        </div>
        <div class="seg" role="group" aria-label="Rozsah">
          <button data-mode="weekend" class="on">Víkendy</button>
          <button data-mode="all">Všechny dny</button>
        </div>
      </div>
      <div class="row chips" id="regions" role="group" aria-label="Město"></div>
      <div class="row chips scroll" id="cats" role="group" aria-label="Kategorie"></div>
      <nav class="row chips scroll jump" id="jump" aria-label="Přejít na"></nav>
    </div>
  </div>

  <main class="wrap" id="feed" aria-live="polite">
    <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
  </main>

  <footer class="wrap foot" id="foot"></footer>

  <script src="app.js"></script>
</body>
</html>
